}

.weak{

}

.improve{

 color:#667085
}

 background:#f8fafc;

 font-size:13px
}

}

.badge{

 background:#eef2ff;

 padding:6px 10px;
 border-radius:20px;
 font-size:13px;

<body>

<div class="wrap">

<h1>QuizHub</h1>

<div class="sub">
Simple Present Tense • Adaptive Practice
</div>


<!-- START -->

<section id="start" class="card">

<div class="badge">
V6 • Adaptive Learning
</div>

<h2>Start Quiz</h2>

<p class="small">
QuizHub will automatically give more practice on areas where the child makes mistakes.
</p>

<label for="name">
Child's name
</label>

<input
 id="name"
 placeholder="Enter child's name"
 autocomplete="name"
 maxlength="50"
>

<button
 id="startButton"
 onclick="startQuiz()">
Start Quiz →
</button>

<div
 class="status"
 id="connection">
⏳ Connecting...
</div>

</section>


<!-- QUIZ -->

<section id="quiz" class="card hidden">

<div

</div>

<div class="progress">
<div id="bar"></div>
</div>

<div
 class="q"

</div>

<div id="options"></div>

<div
 class="feedback"
 id="feedback">
</div>

<button
 id="next"
 class="next hidden"
 onclick="nextQuestion()">
Next Question →
</button>

</section>


<!-- RESULT -->

<section id="result" class="card hidden">

<h2 class="center">
Quiz Analysis
</h2>

<p
 id="child"
 class="center">
</p>

<div
 class="score"
 id="score">
</div>

<p
 id="summary"
 class="summary">
</p>


<div class="analysis strength">

<b>💪 Strengths</b>

<div id="strengths">
</div>

</div>


<div class="analysis weak">

<b>🎯 Weaknesses</b>

<div id="weaknesses">
</div>

</div>


<div class="analysis improve">

<b>📈 Scope of Improvement</b>

<div id="improvement">
</div>

</div>


<div
 class="status"
 id="saveStatus">
</div>

<br>

<button onclick="restartQuiz()">
🔄 Try Again
</button>

</section>

</div>


<!-- SUPABASE JS -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================================

/*

q:"___ your sister work here?",
o:["Do","Does","Are","Is"],

},

{
id:"Q020",
db_id:20,
q:"Water ___ at 100°C.",
o:["boils","boil","boiling","boiled"],

e:"General facts use simple present: boils."

];


/* =========================================================
   VARIABLES
========================================================= */

let i = 0;

let score = 0;

let name = "";

let answered = false;

let currentUser = null;

let wrong = [];

let correct = [];

let quizQuestions = [];

let progressMap = {};


/* =========================================================
   SHOW SCREEN
========================================================= */

function show(id){

 document
 .querySelectorAll("section")
 .forEach(s =>
   s.classList.add("hidden")
 );

 document
 .getElementById(id)
 .classList.remove("hidden");

 window.scrollTo({
   top:0,
   behavior:"smooth"
 });

}


/* =========================================================
   LOAD CURRENT USER
========================================================= */

async function loadCurrentUser(){

 try{

   const {
     data,
     error
   } = await supabaseClient.auth.getUser();


   if(error){

     console.log(
       "Auth error:",
       error.message
     );

     currentUser = null;

     document
     .getElementById("connection")
     .textContent =
     "⚠️ No logged-in user.";

     return;

   }


   currentUser = data.user;


   if(currentUser){

     document
     .getElementById("connection")
     .textContent =
     "☁️ Connected • User UID detected";

     console.log(
       "Current user:",
       currentUser.id
     );

   }else{

     document
     .getElementById("connection")
     .textContent =
     "⚠️ Please log in before starting.";

   }

 }catch(error){

   console.log(
     "User loading error:",
     error
   );

   currentUser = null;

   document
   .getElementById("connection")
   .textContent =
   "⚠️ Unable to connect to account.";

 }

}


/* =========================================================
   LOAD USER PROGRESS
========================================================= */

async function loadUserProgress(){

 if(!currentUser){

   return;

 }

 try{

   const {
     data,
     error
   } = await supabaseClient

     .from("user_question_progress")

     .select(
       "id,user_id,question_id,attempts,mistakes,consecutive_correct,mastered,last_attempt"
     )

     .eq(
       "user_id",
       currentUser.id
     );


   if(error){

     console.log(
       "Progress loading error:",
       error
     );

     return;

   }


   progressMap = {};


   data.forEach(row => {

     progressMap[row.question_id] = row;

   });


   console.log(
     "Progress loaded:",
     progressMap
   );


 }catch(error){

   console.log(
     "Progress error:",
     error
   );

 }

}


/* =========================================================
   SELECT ADAPTIVE QUESTIONS
========================================================= */

function selectAdaptiveQuestions(){

 const available =
 questions.filter(q => {

   const p =
   progressMap[q.db_id];

   return !p || !p.mastered;

 });


 /*
   If there are enough unmastered questions,
   use only those.

   This is how mastered questions gradually
   disappear from the quiz.
 */

 let pool =
 available.length >= QUIZ_SIZE
 ? available
 : available.slice();


 /*
   Questions with mistakes get priority.
 */

 pool.sort((a,b) => {

   const pa =
   progressMap[a.db_id];

   const pb =
   progressMap[b.db_id];


   const ma =
   pa ? pa.mistakes : 0;

   const mb =
   pb ? pb.mistakes : 0;


   if(mb !== ma){

     return mb - ma;

   }


   const ca =
   pa ? pa.consecutive_correct : 0;

   const cb =
   pb ? pb.consecutive_correct : 0;


   return ca - cb;

 });


 /*
   If fewer than QUIZ_SIZE remain,
   fill the remaining positions with
   non-mastered/old questions.

   This prevents an empty quiz while the
   question bank is still small.
 */

 if(pool.length < QUIZ_SIZE){

   const mastered =
   questions.filter(q => {

     const p =
     progressMap[q.db_id];

     return p && p.mastered;

   });


   mastered.sort(() => Math.random() - 0.5);


   pool = pool.concat(
     mastered.slice(
       0,
       QUIZ_SIZE - pool.length
     )
   );

 }


 /*
   Shuffle slightly while preserving
   mistake priority near the top.
 */

 const first =
 pool.slice(
   0,
   Math.min(10,pool.length)
 );


 const rest =
 pool.slice(
   Math.min(10,pool.length)
 );


 rest.sort(
   () => Math.random() - 0.5
 );


 return first
 .concat(rest)
 .slice(0,QUIZ_SIZE);

}


/* =========================================================
   START QUIZ
========================================================= */

async function startQuiz(){

 name =
 document
 .getElementById("name")
 .value
 .trim();


 if(!name){

   name = "Student";

 }


 if(!currentUser){

   alert(
     "Please log in first so QuizHub can save this child's progress."
   );

   return;

 }


 const button =
 document.getElementById("startButton");


 button.disabled = true;

 button.textContent =
 "Loading...";


 await loadUserProgress();


 quizQuestions =
 selectAdaptiveQuestions();


 if(!quizQuestions.length){

   alert(
     "No questions are currently available."
   );

   button.disabled = false;

   button.textContent =
   "Start Quiz →";

   return;

 }


 i = 0;

 score = 0;

 wrong = [];

 correct = [];


 button.disabled = false;

 button.textContent =
 "Start Quiz →";


 show("quiz");


 render();

}


/* =========================================================
   RENDER
========================================================= */

function render(){

 answered = false;


 const x =
 quizQuestions[i];


 document
 .getElementById("qno")
 .textContent =
 `Question ${i+1} of ${quizQuestions.length}`;


 document
 .getElementById("bar")
 .style.width =
 ((i) /
 quizQuestions.length *
 100) + "%";


 document
 .getElementById("question")
 .textContent =
 x.q;


 const options =
 document.getElementById("options");


 options.innerHTML = "";


 document
 .getElementById("feedback")
 .textContent = "";


 const next =
 document.getElementById("next");


 next.classList.add("hidden");


 x.o.forEach((v,n) => {

   const b =
   document.createElement("button");


   b.className =
   "option";


   b.textContent =
   String.fromCharCode(65+n)
   + ") "
   + v;


   b.onclick =
   () => answer(n,b);


   options.appendChild(b);

 });

}


/* =========================================================
   ANSWER
========================================================= */

async function answer(n,b){

 if(answered){

   return;

 }


 answered = true;


 const x =
 quizQuestions[i];


 const isCorrect =
 n === x.a;


 /*
   Update progress immediately.
 */

 await saveQuestionProgress(
   x,
   isCorrect
 );


 const buttons =
 [
   ...document.querySelectorAll(".option")
 ];


 buttons[x.a]
 .classList
 .add("correct");


 if(isCorrect){

   score++;


   correct.push(x.t);


   document
   .getElementById("feedback")
   .textContent =
   "✅ Correct! " + x.e;

 }else{

   b.classList
   .add("wrong");


   wrong.push(x.t);


   document
   .getElementById("feedback")
   .textContent =
   "❌ Incorrect. " + x.e;

 }


 const next =
 document.getElementById("next");


 next.textContent =
 i === quizQuestions.length - 1
 ? "See Analysis →"
 : "Next Question →";


 next.classList.remove("hidden");

}


/* =========================================================
   SAVE / UPDATE QUESTION PROGRESS
========================================================= */

async function saveQuestionProgress(
 question,
 isCorrect
){

 if(!currentUser){

   console.log(
     "No logged-in user."
   );

   return;

 }


 try{

   /*
      First find the existing progress row.
   */

   const {
     data,
     error
   } = await supabaseClient

     .from("user_question_progress")

     .select(
       "id,attempts,mistakes,consecutive_correct,mastered"
     )

     .eq(
       "user_id",
       currentUser.id
     )

     .eq(
       "question_id",
       question.db_id
     )

     .maybeSingle();


   if(error){

     console.log(
       "Progress lookup error:",
       error
     );

     return;

   }


   let attempts = 1;

   let mistakes = 0;

   let consecutiveCorrect = 0;

   let mastered = false;


   /*
      Existing record
   */

   if(data){

     attempts =
     (data.attempts || 0) + 1;


     mistakes =
     (data.mistakes || 0)
     + (isCorrect ? 0 : 1);


     if(isCorrect){

       consecutiveCorrect =
       (data.consecutive_correct || 0)
       + 1;

     }else{

       consecutiveCorrect = 0;

     }


     mastered =
     consecutiveCorrect >=
     MASTER_THRESHOLD;

   }


   /*
      New record
   */

   else{

     attempts = 1;

     mistakes =
     isCorrect ? 0 : 1;

     consecutiveCorrect =
     isCorrect ? 1 : 0;

     mastered =
     consecutiveCorrect >=
     MASTER_THRESHOLD;

   }


   const updateData = {

     user_id:
     currentUser.id,

     question_id:
     question.db_id,

     attempts:
     attempts,

     mistakes:
     mistakes,

     consecutive_correct:
     consecutiveCorrect,

     mastered:
     mastered,

     last_attempt:
     new Date().toISOString()

   };


   /*
      Update existing row
   */

   if(data){

     const {
       error:updateError
     } = await supabaseClient

       .from("user_question_progress")

       .update(updateData)

       .eq(
         "id",
         data.id
       );


     if(updateError){

       console.log(
         "Progress update error:",
         updateError
       );

     }

   }


   /*
      Insert new row
   */

   else{

     const {
       error:insertError
     } = await supabaseClient

       .from("user_question_progress")

       .insert(updateData);


     if(insertError){

       console.log(
         "Progress insert error:",
         insertError
       );

     }

   }


   /*
      Update local progress cache too.
   */

   progressMap[question.db_id] = {

     attempts:
     attempts,

     mistakes:
     mistakes,

     consecutive_correct:
     consecutiveCorrect,

     mastered:
     mastered

   };


   console.log(
     "Question progress:",
     question.id,
     updateData
   );


 }catch(error){

   console.log(
     "Progress save error:",
     error
   );

 }

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(){

 i++;


 if(i < quizQuestions.length){

   render();

 }else{

   finish();

 }

}


/* =========================================================
   UNIQUE VALUES
========================================================= */

function uniq(a){

 return [
   ...new Set(a)
 ];

}


/* =========================================================
   SAVE QUIZ RESULT
========================================================= */

async function saveOnline(result){

 if(!currentUser){

   return false;

 }


 try{

   const {
     error
   } = await supabaseClient

     .from("quiz_results")

     .insert(result);


   if(error){

     console.log(
       "Online save error:",
       error
     );

     return false;

   }


   return true;


 }catch(error){

   console.log(
     "Online save error:",
     error
   );

   return false;

 }

}


/* =========================================================
   FINISH
========================================================= */

async function finish(){

 const total =
 quizQuestions.length;


 const pct =
 Math.round(
   score / total * 100
 );


 const strengths =
 uniq(correct);


 const weaknesses =
 uniq(wrong);


 const improvement =
 weaknesses.length

 ? `Practice more questions on ${weaknesses.join(", ")} and review the explanations.`

 : "Excellent work! Try a harder quiz to identify your next area for improvement.";


 document
 .getElementById("child")
 .textContent =
 `Child: ${name}`;


 document
 .getElementById("score")
 .textContent =
 `${score} / ${total}`;


 document
 .getElementById("summary")
 .textContent =
 `Percentage: ${pct}%`;


 document
 .getElementById("strengths")
 .textContent =

 strengths.length
 ? strengths.join(" • ")
 : "Keep practicing all areas.";


 document
 .getElementById("weaknesses")
 .textContent =

 weaknesses.length
 ? weaknesses.join(" • ")
 : "No major weakness detected in this quiz.";


 document
 .getElementById("improvement")
 .textContent =
 improvement;


 show("result");


 document
 .getElementById("saveStatus")
 .textContent =
 "⏳ Saving result...";


 const saved =
 await saveOnline({

   user_id:
   currentUser.id,

   child_name:
   name,

   quiz_name:
   "Simple Present Tense",

   score:
   score,

   total:
   total,

   percentage:
   pct,

   strengths:
   strengths.join(", "),

   weaknesses:
   weaknesses.join(", "),

   improvement:
   improvement

 });


 document
 .getElementById("saveStatus")
 .textContent =

 saved

 ? "☁️ Result saved online successfully."

 : "⚠️ Quiz completed, but the result could not be saved.";

}


/* =========================================================
   RESTART
========================================================= */

function restartQuiz(){

 document
 .getElementById("name")
 .value =
 name;


 show("start");

}


/* =========================================================
   AUTH STATE CHANGES
========================================================= */

supabaseClient.auth
.onAuthStateChange(
 async (event,session) => {

   currentUser =
   session
   ? session.user
   : null;


   if(currentUser){

     document
     .getElementById("connection")
     .textContent =
     "☁️ Connected • User UID detected";

   }else{

     document
     .getElementById("connection")
     .textContent =
     "⚠️ No logged-in user.";

   }

 }
);


/* =========================================================
   INITIALIZE
========================================================= */

loadCurrentUser();

</script>
